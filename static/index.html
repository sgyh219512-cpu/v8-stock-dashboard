<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주도섹터·대장주 V8</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:system-ui,-apple-system,sans-serif;
 background:linear-gradient(135deg,#e9f8ff,#fff0f6,#efffea);
 color:#17345f
}
main{max-width:720px;margin:auto;padding:18px}
.card{
 padding:20px;
 margin:14px 0;
 border-radius:24px;
 border:1px solid #d8e8ef;
 background:#fff;
 box-shadow:0 8px 24px #7798a522
}
.hero{background:linear-gradient(120deg,#dff5ff,#ffe7f1,#e9ffe9)}
.blue{background:#e7f7ff}
.pink{background:#ffedf5}
.green{background:#edffef}
h1{margin:0;font-size:27px}
.v{color:#ff3c91}
.status{font-size:20px;font-weight:900;margin-top:10px}
button{
 padding:14px 16px;
 border:0;
 border-radius:14px;
 background:#ff5b9d;
 color:white;
 font-weight:900;
 font-size:16px
}
pre{
 white-space:pre-wrap;
 word-break:break-word;
 background:#f7fafc;
 padding:12px;
 border-radius:14px
}
</style>
</head>

<body>
<main>

<div class="card hero">
<h1>📈 주도섹터·대장주 <span class="v">V8</span> 👑</h1>
<p>키움 REST API · 클라우드 실전 연결판</p>
</div>

<div class="card blue">
<h2>📡 서버 상태</h2>
<div id="status" class="status">확인 중...</div>
</div>

<div class="card green">
<h2>🔥 오늘의 주도섹터 TOP5</h2>
<div id="sectors">API 데이터 연결 준비 중</div>
</div>

<div class="card">
<h2>👑 대장주</h2>
<div id="leaders">API 데이터 연결 준비 중</div>
</div>

<div class="card pink">
<h2>🎯 종가베팅 후보 2선</h2>
<p>🥇 1순위 : 데이터 분석 대기</p>
<p>🥈 2순위 : 데이터 분석 대기</p>
</div>

<div class="card">
<button onclick="testKiwoom()">키움 API 인증 테스트</button>
<pre id="result">아직 테스트하지 않았습니다.</pre>
</div>

</main>

<script>
fetch('/api/health')
 .then(r=>r.json())
 .then(d=>{
   document.getElementById('status').textContent =
     d.credentials_configured
     ? '🟢 서버 정상 · 키움 API 키 설정됨'
     : '🟡 서버 정상 · API 키 입력 대기';
 })
 .catch(()=>{
   document.getElementById('status').textContent='🔴 서버 연결 확인 필요';
 });

async function testKiwoom(){
 const box=document.getElementById('result');
 box.textContent='인증 테스트 중...';

 try{
   const r=await fetch('/api/kiwoom/token-test');
   const d=await r.json();

   if(d.ok){
     box.textContent='✅ 키움 REST API 인증 성공\n만료시간: '
       +(d.expires_dt || '확인 완료');
   }else{
     box.textContent='❌ 인증 실패\n'+(d.message || '');
   }
 }catch(e){
   box.textContent='❌ 서버 통신 오류';
 }
}
</script>

</body>
</html>
